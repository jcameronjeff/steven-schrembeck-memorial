name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/prepare_pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/configure-pages@v5
      - run: python3 scripts/prepare_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/github-pages
      - uses: actions/deploy-pages@v4
        id: deployment
